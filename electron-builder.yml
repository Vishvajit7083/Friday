appId: com.friday.desktop.assistant
productName: F.R.I.D.A.Y. Command Center
directories:
  output: release
  buildResources: electron
files:
  - dist/**/*
  - dist-electron/**/*
  - server.ts
  - server/**/*
  - src/core/**/*
  - electron/**/*
  - electron-builder.yml
  - package.json
asarUnpack:
  - dist/**/*
  - electron-builder.yml
  - electron/icon.ico
  - electron/icon.png
win:
  icon: electron/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: FRIDAY-Setup-${version}.exe
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: F.R.I.D.A.Y.
  installerIcon: electron/icon.ico
  uninstallerIcon: electron/icon.ico
  installerHeaderIcon: electron/icon.ico
